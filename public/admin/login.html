<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - Droppii Affiliate</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E232A 0%, #0F172A 100%);
      padding: 16px;
    }
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .login-brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary);
    }
    .login-brand-sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">🔐</div>
      <h1 class="login-brand-title">HỆ THỐNG QUẢN TRỊ</h1>
      <p class="login-brand-sub">Droppii Affiliate CMS Control Panel</p>
    </div>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="adminEmail">Email quản trị viên</label>
        <input
          type="email"
          id="adminEmail"
          class="form-input"
          placeholder="admin@example.com"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Mật khẩu</label>
        <input
          type="password"
          id="adminPassword"
          class="form-input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button
        type="submit"
        id="btnLoginSubmit"
        class="btn-submit-primary"
        style="margin-top: 12px; padding: 12px; font-size: 1rem;"
      >
        Đăng nhập vào hệ thống
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/" style="font-size: 0.85rem; color: var(--secondary); font-weight: 600;">← Quay lại Trang Chủ</a>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      const token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
      if (token) {
        window.location.href = '/admin';
        return;
      }

      const form = document.getElementById('adminLoginForm');
      const submitBtn = document.getElementById('btnLoginSubmit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        if (!email || !password) {
          showToast('Vui lòng nhập đầy đủ Email và Mật khẩu', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang xác thực...';

        try {
          const res = await API.post('/admin/login', { email, password });
          if (res.success && res.data.token) {
            localStorage.setItem('adminToken', res.data.token);
            sessionStorage.setItem('adminToken', res.data.token);
            localStorage.setItem('adminUser', JSON.stringify(res.data));
            showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');
            setTimeout(() => {
              window.location.href = '/admin';
            }, 600);
          }
        } catch (err) {
          showToast(err.message || 'Email hoặc mật khẩu không chính xác', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Đăng nhập vào hệ thống';
        }
      });
    });
  </script>
</body>
</html>
